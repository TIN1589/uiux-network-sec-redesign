<!-- TEST RESULTS TABLE BODY & WRAPPER -->
<div class="soc-card soc-card-pad">
  <h2 class="soc-card-title" style="margin-bottom: 16px;">Test results</h2>
  <div class="soc-table-wrap">
    <table class="soc-table">
      <thead>
        <tr>
          <th scope="col">TESTED (GMT+7)</th>
          <th scope="col">TECHNIQUE</th>
          <th scope="col">TOOL</th>
          <th scope="col">RULE</th>
          <th scope="col">LINKED ALERT</th>
          <th scope="col">RESULT</th>
          <th scope="col">DELTA</th>
          <th scope="col">NOTES</th>
          <th scope="col" style="text-align: right;"><span class="sr-only">Actions</span></th>
        </tr>
      </thead>
      <tbody id="sc-results-tbody">
        {% for r in scenarios %}
        <tr class="{% if r.highlighted %}highlighted{% endif %}">
          <td class="font-mono" style="font-weight: 500; color: var(--color-text-primary); white-space: nowrap;">{{ r.testedTs }}</td>
          <td>
            <div class="font-mono" style="font-size: 13px; font-weight: 700; color: var(--color-text-primary);">{{ r.code }}</div>
            <div style="font-size: 12px; color: var(--color-text-muted); margin-top: 2px;">{{ r.name }}</div>
          </td>
          <td style="color: var(--color-text-primary);">{{ r.tool }}</td>
          <td class="font-mono" style="font-size: 13px; color: var(--color-text-primary);">{{ r.rule }}</td>
          <td>
            <button type="button" onclick="openAlertDrawer('{{ r.linkedEventId }}')" class="soc-btn-link font-mono" style="font-size: 12px;">
              {{ r.linkedEventId }}
            </button>
          </td>
          <td>
            {% if r.detected %}
            <span class="soc-badge badge-resolved">Detected</span>
            {% else %}
            <span class="soc-badge badge-critical">Missed</span>
            {% endif %}
          </td>
          <td style="white-space: nowrap;">
            <span style="font-weight: 700; color: var(--color-text-primary);">{{ r.delta }} s</span>
            <span style="font-size: 12px; color: var(--color-text-muted);"> of 5 s</span>
          </td>
          <td style="font-size: 13px; color: var(--color-text-secondary); max-width: 280px;">{{ r.notes }}</td>
          <td class="row-action-cell">
            <div class="row-action-menu-wrap">
              <button type="button" data-min-role="admin"
                      onclick="toggleRowMenu('sc-menu-{{ r.id }}', event)"
                      aria-label="Actions for test {{ r.code }}"
                      aria-haspopup="true"
                      class="soc-btn soc-btn-outline soc-btn-icon"
                      style="width: 32px; height: 32px; min-height: 32px; font-weight: 700; font-size: 14px;">
                ⋯
              </button>
              <div id="sc-menu-{{ r.id }}" class="row-menu-dropdown hidden" role="menu">
                <button type="button" onclick="editScenarioRow('{{ r.id }}'); closeAllRowMenus();"
                        class="row-menu-item" role="menuitem">
                  <i class="fa-solid fa-pen-to-square" style="font-size: 11px;" aria-hidden="true"></i> Edit
                </button>
                <button type="button"
                        hx-delete="/api/scenarios/{{ r.id }}"
                        hx-target="#scenarios-table-container"
                        onclick="closeAllRowMenus();"
                        class="row-menu-item danger" role="menuitem">
                  <i class="fa-solid fa-trash" style="font-size: 11px;" aria-hidden="true"></i> Delete
                </button>
              </div>
            </div>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
