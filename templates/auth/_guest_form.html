{# Form đăng nhập chế độ Khách (Read-only) bảo vệ bằng CSRF #}
<form class="auth-guest-form" method="post" action="{{ url_for('auth.guest') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button type="submit" class="btn btn--ghost">
    Continue as guest (read-only)
  </button>
</form>
