<!-- TOP FLOATING UTILITY BAR (Rule Section 4: border-bottom chạy suốt chiều ngang, padding ngang 40px) -->
<header id="app-topbar" role="banner">
  <!-- Left: Menu Button (<1024px) + Live Pill Badge -->
  <div class="topbar-left">
    <button type="button" id="topbar-menu-btn" onclick="openMobileSidebar()" aria-label="Open navigation menu"
      class="soc-btn soc-btn-secondary soc-btn-icon">
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>

    <div id="live-status-pill" role="status" aria-live="polite" class="soc-badge" style="background-color: #FFFFFF; border: 1px solid var(--color-border-card); color: var(--color-text-secondary); box-shadow: var(--shadow-2xs); padding: 6px 12px;">
      <span id="live-status-dot" class="status-dot dot-live" aria-hidden="true"></span>
      <span id="live-status-text">Live · updated <span id="live-sec-counter" class="font-mono">5s</span> ago · GMT+7</span>
    </div>
  </div>

  <!-- Right: Auto-Refresh Pill + Analyst Avatar + Role Switcher -->
  <div class="topbar-right">
    <button type="button" onclick="toggleAutoRefresh()" id="btn-autorefresh" aria-pressed="true"
      class="soc-btn soc-btn-outline soc-btn-sm">
      Auto-refresh: on
    </button>

    <!-- Analyst Profile & Role Switcher Dropdown (ASSUMPTION-03) -->
    <div style="position: relative;" id="analyst-menu-wrapper">
      <button type="button" onclick="toggleAnalystMenu()" id="analyst-avatar-btn"
        title="Sign in / Switch analyst / Change role"
        aria-haspopup="true" aria-expanded="false"
        style="display: flex; align-items: center; gap: 10px; padding: 2px 4px; border-radius: var(--radius-full); text-align: left; cursor: pointer;">
        <div id="analyst-avatar-circle"
          style="width: 32px; height: 32px; border-radius: var(--radius-full); background-color: var(--color-obsidian-900); color: var(--color-accent-lime); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center;">
          A
        </div>
        <div style="display: flex; flex-direction: column; line-height: 1.15;" class="analyst-info-text">
          <span style="font-size: 11px; color: var(--color-text-muted);">Analyst</span>
          <span id="topbar-analyst-name" style="font-size: 12px; font-weight: 700; color: var(--color-text-primary);">admin</span>
        </div>
        <i class="fa-solid fa-chevron-down" style="font-size: 10px; color: var(--color-text-muted); margin-left: 2px;" aria-hidden="true"></i>
      </button>

      <!-- Dropdown Menu -->
      <div id="analyst-dropdown"
        style="display: none; position: absolute; right: 0; top: calc(100% + 8px); min-width: 220px;
               background: var(--color-surface-card); border: 1px solid var(--color-border-card);
               border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); z-index: 200; overflow: hidden;">

        <!-- Sign In / Out Section -->
        <div style="padding: 12px 16px; border-bottom: 1px solid var(--color-border-card);">
          <div style="font-size: 11px; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px;">Session</div>
          <button type="button" onclick="openSignInModal(); closeAnalystMenu();"
            style="width: 100%; text-align: left; font-size: 13px; color: var(--color-text-primary); padding: 6px 0; cursor: pointer; display: flex; align-items: center; gap: 8px; background: none; border: none;">
            <i class="fa-solid fa-right-to-bracket" style="width: 14px;" aria-hidden="true"></i>
            Sign in / Switch account
          </button>
          <button type="button" onclick="handleSignOut();"
            style="width: 100%; text-align: left; font-size: 13px; color: var(--color-text-secondary); padding: 6px 0; cursor: pointer; display: flex; align-items: center; gap: 8px; background: none; border: none;">
            <i class="fa-solid fa-right-from-bracket" style="width: 14px;" aria-hidden="true"></i>
            Sign out
          </button>
        </div>

        <!-- Role Switcher Section (ASSUMPTION-03) -->
        <div style="padding: 12px 16px;">
          <div style="font-size: 11px; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px;">
            Role <span style="color: var(--color-accent-lime); font-weight: 700;">[DEMO]</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <button type="button" onclick="switchRole('admin')" data-role="admin"
              class="role-switcher-btn role-btn-active"
              style="width: 100%; text-align: left; font-size: 13px; padding: 8px 10px; border-radius: var(--radius-md); cursor: pointer; display: flex; align-items: center; justify-content: space-between;">
              <span style="display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-user-shield" style="width: 14px; color: var(--color-accent-lime);" aria-hidden="true"></i>
                SecOps Admin
              </span>
              <i id="role-check-admin" class="fa-solid fa-check" style="font-size: 11px; color: var(--color-accent-lime);" aria-hidden="true"></i>
            </button>
            <button type="button" onclick="switchRole('tier2')" data-role="tier2"
              class="role-switcher-btn"
              style="width: 100%; text-align: left; font-size: 13px; padding: 8px 10px; border-radius: var(--radius-md); cursor: pointer; display: flex; align-items: center; justify-content: space-between;">
              <span style="display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-magnifying-glass-chart" style="width: 14px; color: var(--color-text-secondary);" aria-hidden="true"></i>
                Tier-2 Analyst
              </span>
              <i id="role-check-tier2" class="fa-solid fa-check hidden" style="font-size: 11px; color: var(--color-accent-lime);" aria-hidden="true"></i>
            </button>
            <button type="button" onclick="switchRole('tier1')" data-role="tier1"
              class="role-switcher-btn"
              style="width: 100%; text-align: left; font-size: 13px; padding: 8px 10px; border-radius: var(--radius-md); cursor: pointer; display: flex; align-items: center; justify-content: space-between;">
              <span style="display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-user" style="width: 14px; color: var(--color-text-secondary);" aria-hidden="true"></i>
                Tier-1 Responder
              </span>
              <i id="role-check-tier1" class="fa-solid fa-check hidden" style="font-size: 11px; color: var(--color-accent-lime);" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
